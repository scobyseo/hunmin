name: ci
# WHAT RUNS RIGHT NOW. On 2026-11-01 the maintainer said
#
#   "now enable mingw test only, and disable all others until i request."
#
# and then
#
#   "let's disable commit test too. only pr-test is enough."
#
# so exactly two jobs run -- `mingw` (a cross-compile) and `linux` on a pull
# request (the PR rung, `ctest -LE tier-E1`) -- and every other job carries
# `if: false` with its previous condition in a comment beside it. Re-enabling one
# is deleting that line; nothing else in the file depends on the set.
#
# THERE IS NO COMMIT RUNG IN CI, by the second instruction. docs/TESTING.md's
# commit level (`ctest -L guard`, 19.4 s on the reference host) stays a LOCAL
# selection -- that is where a sub-minute gate belongs and how it is meant to be
# run, and the PR rung contains it anyway.
#
# NOTHING HERE RUNS TODAY: issue #102 is the account-level Actions billing
# failure, and every job it starts dies in about three seconds with "job was not
# started because recent account payments have failed or your spending limit
# needs to be increased". So the set below is what runs when #102 is fixed, not
# evidence about the tree in the meantime -- and which set that should be is the
# maintainer's call after #102, not this file's.
#
# The ladder these jobs belong to is docs/TESTING.md §"The three levels"
# (commit < PR < nightly == release). When they are all on again, the routing is:
#
#   push              nothing -- the commit rung is a local selection
#   pull_request      the PR rung -- linux (`-LE tier-E1`), mingw, android
#                     (E0/E1 in the JVM, E2 in the emulator), deb
#   schedule          nightly == release -- the same, plus the release APK job
#                     and the LeakSanitizer fuzz job
#   workflow_dispatch everything, by hand
#
# Before 2026-11-01 every push paid all of it: 45 min (android), 45 min (deb) and
# 3 min (linux) against a commit rung whose own budget is under a minute. That
# budget is docs/TESTING.md's ("the commit rung has to be under a minute, or it
# stops being run"), not a new one; the unit costs are docs/CI-TIMING.md's.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    # 3 minutes, set 2026-10-15. The job measured 8 m 24 s before this
    # (docs/CI-TIMING.md §1); the 5-minute ceiling set the same day was met by
    # excluding tier E1 (ctest 269 s -> ~37 s), and 3 minutes is met by ALSO
    # caching the fcitx5 5.1.13 install tree, which was the remaining 197 s
    # segment and ran on every commit with nothing cached.
    #
    # The budget with both levers: apt install 22 s + cache restore ~10 s +
    # cmake/build 9 s + ctest ~37 s + snapshot 0.14 s (measured, not guessed --
    # tools/ci-env-snapshot.sh on a 16-core host) = ~78 s against 180 s of
    # allowance, so the ceiling has real headroom rather than being a number
    # the job barely fits. On a cache MISS the fcitx5 build returns (197 s) and
    # the job cannot fit -- that is the cold path, paid once per tag bump, and
    # it will show as a timeout rather than a silent slow run. If that happens,
    # the fix is to let the cold build finish and cache it, not to raise the
    # number.
    #
    # CI minutes are a cost, and a job with no ceiling is a job whose cost is
    # unbounded -- the same overspend shape that got CI usage suspended, one
    # level down.
    timeout-minutes: 3
    # THE PR RUNG, and the only TEST job that runs (2026-11-01, the instructions
    # quoted at the top of this file): `ctest -LE tier-E1` on a pull request. It
    # costs the fcitx5 source build plus the suite inside a 3-minute ceiling,
    # which is what a pull request is for; a push now runs nothing at all.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      # fcitx5-modules-dev carries Fcitx5Utils/Fcitx5Module cmake configs, which
      # the addon and tier C's trace emitter both need; without it the fcitx5
      # frontend is silently dropped and 104 conformance tests never register,
      # which reads as "green" while testing nothing.
      #
      # MEASURED 2026-10-13 (issue #8), two separate findings:
      #
      # 1. The workflow file itself was invalid -- the android job carried a
      #    job-level `paths:` (a trigger filter, not a job property), so GitHub
      #    rejected the whole file and NO job ever ran on any commit. The
      #    android path filter is now a job-level `if:` (see that job); the
      #    `if: failure()` quoting fixed alongside was a real but separate
      #    latent YAML-1.1 boolean bug.
      #
      # 2. The addon needs fcitx5 >= 5.1.13 (FCITX_ADDON_FACTORY_V2 at
      #    hunminadapter.cpp:619, setComment at :461 -- both measured present from 5.1.13
      #    upstream). Ubuntu 24.04's fcitx5-modules-dev is 5.1.7, below the floor,
      #    so it neither configures nor compiles. This job therefore builds
      #    fcitx5 5.1.13 from source -- the same route the host took
      #    (docs/ENVIRONMENT.md) -- because there is no distro package for it.
      #    The shipped .deb requires >= 5.1.13 too, so a 24.04 user installs this
      #    source-built fcitx5, not the distro's.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libhangul-dev \
            python3 extra-cmake-modules gettext \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-util-dev libxcb-xkb-dev libxcb-xfixes0-dev \
            libxcb-icccm4-dev libxcb-xinerama0-dev libxcb-randr0-dev \
            libxcb-ewmh-dev libxcb-keysyms1-dev libxcb-imdkit-dev \
            libxcb-util0-dev libxcb-image0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-cursor-dev \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libexpat1-dev libxkbfile-dev \
            libjson-c-dev libdbus-1-dev libuv1-dev uuid-dev \
            libwayland-dev wayland-protocols libxdo-dev libevent-dev libfmt-dev \
            iso-codes xkb-data
      # fcitx5 5.1.13, CACHED as its install tree.
      #
      # MEASURED 2026-10-15: this build is 197 s and was the single largest
      # segment of the job, run on every commit with nothing cached -- the job
      # could not fit the 3-minute ceiling (set the same day) without it. The
      # ceiling is 180 s and the un-cached build alone is 197 s, so the cache
      # is not an optimisation here, it is the precondition for the limit.
      #
      # Cached as the INSTALL TREE, not the build dir, for two reasons. The deb
      # job restores this same tree as an artefact and depends on its paths:
      # its dh_shlibdeps reads dpkg's database to resolve what the addon links,
      # and a source-built fcitx5 owns no package -- debian/rules:82-83 works
      # around that with --ignore-missing-info, which holds only if the restored
      # tree lands in the same paths (/usr/lib/x86_64-linux-gnu,
      # /usr/include/Fcitx5, /usr/lib/x86_64-linux-gnu/cmake). A cached tree
      # that is byte-identical to the uploaded one keeps both consumers honest.
      # And a build dir cache would key on the build path, which differs between
      # the restore job and this one, so it would miss.
      #
      # Keyed on the pinned tag only: the build inputs are `git clone --depth 1
      # --branch 5.1.13` plus the flags below, so a tag bump is the only thing
      # that should invalidate it. restore-keys fall back to the newest cache,
      # so an fcitx5 upgrade is a hit on the old tree rather than a cold build.
      - name: Restore the fcitx5 5.1.13 install tree
        id: fcitx5-cache
        uses: actions/cache@v4
        with:
          path: /tmp/fcitx5-install
          key: ${{ runner.os }}-fcitx5-5.1.13-install-v1
          restore-keys: |
            ${{ runner.os }}-fcitx5-5.1.13-install-
      - name: Build fcitx5 5.1.13 from source (distro ships 5.1.7, below the floor)
        # Built once per job and CACHED, measured 2026-10-14 for issue #59: this
        # clone-configure-build-install is 197 s in the linux job and 326 s in
        # the deb job -- 523 s of the workflow's wall clock for the same
        # artefact, built twice, with nothing shared between them. The cache
        # below is the fix: build once, upload the install tree, and every other
        # job restores it.
        #
        # Why the install tree rather than the build dir: the deb job's
        # dh_shlibdeps reads dpkg's database to resolve what the addon links, and
        # a source-built fcitx5 owns no package -- debian/rules:82-83 already
        # works around that with --ignore-missing-info, and that workaround holds
        # only if the restored tree lands in the same paths (/usr/lib/x86_64-
        # linux-gnu, /usr/include/Fcitx5, /usr/lib/x86_64-linux-gnu/cmake). A
        # restored /usr tree is byte-identical in what it puts where, which is
        # what makes this checkable in one run: if the deb job's
        # Fcitx5CoreConfig.cmake resolves and the addon configures, the
        # restore landed correctly.
        id: fcitx5-build
        if: steps.fcitx5-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 5.1.13 https://github.com/fcitx/fcitx5.git /tmp/fcitx5
          cmake -S /tmp/fcitx5 -B /tmp/fcitx5/build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/tmp/fcitx5-install -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TEST=OFF -DENABLE_X11=ON -DENABLE_WAYLAND=ON \
            -DENABLE_DBUS=ON -DENABLE_KEYBOARD=ON -DENABLE_ENCHANT=OFF \
            > /tmp/fcitx5-config.log 2>&1 || { tail -40 /tmp/fcitx5-config.log; exit 1; }
          cmake --build /tmp/fcitx5/build --target install
      - name: Install fcitx5 into /usr
        # From the cache when it hit, from the build above when it did not. The
        # install is what the addon and the D3 harness link against, so it has
        # to be in /usr either way -- the cache only removes the 197 s build.
        #
        # The guard is a real check, not a formality: a cache entry that
        # restored an empty or partial tree would otherwise fail later at
        # "Fcitx5Core not found", which reads as a build problem rather than a
        # restore problem.
        run: |
          test -f /tmp/fcitx5-install/usr/lib/x86_64-linux-gnu/libFcitx5Core.so.7 \
            || { echo "fcitx5 install tree is missing libFcitx5Core.so.7" >&2; exit 1; }
          sudo cp -a /tmp/fcitx5-install/usr/. /usr/
          sudo ldconfig
          pkg-config --modversion Fcitx5Core
      # The install tree, uploaded for the deb job to restore. Prefixless paths
      # inside the archive, restored under / by the consumer with sudo.
      #
      # The `root:` below is load-bearing, and it fixes a latent bug that
      # predates the cache. Before this line the upload listed absolute
      # `/usr/lib/...` and `/usr/include/...` paths; upload-artifact@v4 strips
      # their least common ancestor (`/usr`), so the archive held `lib/` and
      # `include/` at its root. The deb job restores into `/tmp/fcitx5-install`
      # and then copies `/tmp/fcitx5-install/usr/.` into `/usr/` -- a `usr/`
      # level the archive never contained -- so its `test -d .../usr/lib/.../
      # cmake/Fcitx5Core` guard would fail, and fail with "restore is missing
      # Fcitx5Core cmake configs", which reads as a restore problem while the
      # cause is the upload's layout. Naming `root:` makes the layout explicit
      # instead of implied by which paths happen to be listed, so the guard
      # checks the thing it names.
      #
      # Not re-measured on CI: no run has executed since. The first deb run
      # after this lands is the confirmation, and docs/CI-TIMING.md records the
      # same caveat.
      - name: Upload the fcitx5 install tree
        if: steps.fcitx5-build.outcome == 'success' || steps.fcitx5-cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-5.1.13-install
          root: /tmp/fcitx5-install/usr
          path: .
          retention-days: 1
          if-no-files-found: error
      # The Gradle cache, measured 2026-10-14 for issue #59. This job is the one
      # the measurement is about: its ctest ran engine-android-e1 at 148.38 s and
      # android-mutations at 84.31 s, and 126.24 s of the first of those is cold
      # Gradle -- measured by emptying GRADLE_USER_HOME, against 22.95 s warm.
      # The cache that makes the difference is wrapper/dists (143 MB),
      # caches/modules-2 (394 MB) and caches/build-cache-1 (124 MB).
      #
      # This job needs it for the same reason the android job does, and the
      # reason is not obvious: it runs the Android tiers at all only because the
      # runner IMAGE ships an Android SDK this workflow never installs (the
      # Ubuntu 24.04 image's ANDROID_HOME and the exact NDK this repo pins), so
      # the CMakeLists.txt:192 guard fires and engine-android-e1 / android-mutations
      # / the tier-C Android corpus all run here. The android job then re-runs the
      # same two tests at ci.yml, which is why the cache is shared with it: the
      # same key in both jobs means the second one to run restores what the first
      # populated.
      #
      # Keyed on gradle.properties and the wrapper properties: both decide what
      # is downloaded and what can be reused, so either changing invalidates the
      # key rather than serving a classpath built for a different dependency set.
      # The restore-keys fall back to the newest cache, so a single dependency
      # bump is a hit rather than a miss.
      - name: Restore the Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontends/android/gradle.properties', 'frontends/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install pyright (docs-lint asserts tools/ is clean)
        # The M5-CLOSED assertion row runs `pyright tools/` inside docs-lint;
        # without the tool it fails with FileNotFoundError (measured on CI
        # 2026-10-13), not a code defect. Install it so the assertion is real.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install pyright
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHUNMIN_TRACE_BUILD=ON
      - run: cmake --build build -j4
      # The environment snapshot, taken BEFORE ctest and unconditionally.
      #
      # WHY FIRST. A red run whose cause is environmental -- a tier that did
      # not register, a tool the runner image lacks, a data input that is
      # absent -- cannot be reproduced locally without knowing what the runner
      # actually had, and finding out by re-running CI is a CI minute spent on
      # diagnosis. Two measured instances of exactly that: tier D3 is Skipped
      # here because the image ships no xvfb, and tier E1 registers only
      # because the image ships an Android SDK the workflow never installs
      # (docs/CI-TIMING.md §1). Neither is visible in a pass/fail summary.
      #
      # Unconditional rather than `if: failure()`, so the snapshot survives a
      # hard abort that skips later steps, and so a green run's snapshot can
      # be diffed against a red one. tools/ci-env-snapshot.sh is the local
      # equivalent -- run it here and the two outputs are directly comparable.
      - name: Snapshot the environment (before ctest, always)
        run: ./tools/ci-env-snapshot.sh build | tee ci-env-snapshot.txt
      # -j4, measured 2026-10-14 for issue #59. On this host the same suite is
      # 189.76 s serial and 47.82 s at -j16, and the serial ctest alone is 269 s
      # of this job's 504 s. The three heavyweight tests cap the gain: ctest's
      # RUN_SERIAL on engine-android-e1 is honoured by -j, and android-mutations
      # is nine sequential tools/android-unit.sh runs, so at most one of them
      # can overlap frontend-mutations. Measured locally on the trio itself,
      # 113.46 s serial -> 67.15 s at -j4.
      #
      # NOT -j16: the runner has 4 cores, and the repo has been bitten by
      # oversubscription before -- fourteen conformance tests deleting each
      # other's R-def.txt under -j16 is recorded in tools/android-trace-emit.sh's
      # header comment, which is why that script guards its Gradle classpath
      # with a flock. -j4 matches the runner's actual parallelism.
      #
      # -LE 'tier-E1', added 2026-10-15 to fit the 5-minute ceiling above.
      # Option A of docs/CI-TIMING.md §3, measured there: linux's ctest goes
      # from 269 s to about 37 s and the job from 504 s to about 235 s.
      # What it costs is stated in that section and not repeated here: the
      # linux job stops being a second place the Android adapter is proved to
      # pass, which matters only while the android job is the red one. The
      # android job runs exactly `engine-android-goldens|engine-android-e1|
      # android-mutations` at its "Tier E0 + E1" step, so the coverage is not
      # lost, it is de-duplicated. The tier-C Android corpus is NOT excluded
      # -- it registers under `tier-C`, and this job is where it runs.
      - run: ctest --test-dir build -j4 --output-on-failure -LE 'tier-E1'
      # On failure, keep the evidence. The snapshot above says WHAT the runner
      # had; this keeps it together with the per-test output, so a local
      # reproduction starts from both instead of from a re-run. Uploaded as an
      # artefact rather than printed, because the log is where the failure
      # detail already is and the artefact is what survives to be downloaded.
      - name: Upload the failure evidence
        if: "failure()"
        uses: actions/upload-artifact@v4
        with:
          name: linux-failure-evidence
          path: |
            ci-env-snapshot.txt
            build/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: warn

  # P5's gate is "HW keyboard e2e on emulator CI", and until this job existed
  # the Android tiers could only be reached by hand. It covers three of the four
  # -- E0 (engine on device), E1 (adapter against the real engine) and E2 (the
  # APK typed into with real key events) -- plus the mutation self-test that
  # proves E1 can fail at all.
  android:
    name: android (emulator)
    # A system-image download plus a boot, so it runs only for changes that can
    # actually break it. A docs-only commit must not pay for an AVD -- and
    # "only runs sometimes" is a property worth stating, because the P5 gate
    # depends on this job running at all.
    #
    # The path filter is a JOB-LEVEL `if:`, not a `paths:` filter. Two reasons,
    # both measured 2026-10-13 (issue #8):
    #   - A job-level `paths:` is not a valid job property; it makes GitHub
    #     reject the WHOLE workflow file at parse, so no job ran on any commit
    #     since the initial public one. (That was the first version here.)
    #   - Moving `paths:` up to on.push fixed the parse but gated the ENTIRE
    #     workflow on Android-relevant paths -- so a debian/rules or tools/*.py
    #     change skipped linux/deb/mingw/windows too, which is exactly the
    #     "green CI is compatible with a broken release build" failure the issue
    #     is about. (Measured: two commits touching tools/android-mutations.py
    #     and debian/rules triggered no run at all.)
    # DISABLED 2026-11-01 -- see the header. Re-enable with the expression this
    # replaced:
    #   github.event_name != 'push' &&
    #   (!cancelled() && !contains(github.event.head_commit.message, '[skip android]'))
    # An AVD boot is the most expensive thing this workflow does, and the Espresso
    # E2 tier depends on this job, so the PR rung is where it belongs.
    if: false
    runs-on: ubuntu-24.04
    # NOT 5 minutes: this job downloads the Android SDK, creates an AVD, boots
    # an emulator and runs two instrumentation suites inside it. The SDK install
    # alone is a multi-minute network step that no caching removes. A 5-minute
    # ceiling would kill the job before the emulator boots, and the P5 gate
    # ("HW keyboard e2e on emulator CI") is exactly what this job exists for.
    # 45 minutes is the measured budget for that whole sequence.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle cache, measured 2026-10-14 for issue #59: tools/android-unit.sh
      # takes 126.24 s against an empty GRADLE_USER_HOME and 22.95 s against this
      # host's warm one, and the cache that makes the difference is wrapper/dists
      # (143 MB), caches/modules-2 (394 MB) and caches/build-cache-1 (124 MB).
      # android-mutations then runs the same script nine times. The CI logs
      # measure the cold figure directly -- engine-android-e1 at 148.38 s here
      # and 185.68 s in the deb job, against 23 s warm -- and until this step
      # existed no job in this workflow cached any of it
      # (`grep -rn 'actions/cache' .github/workflows/ci.yml` returned nothing).
      #
      # Keyed on gradle.properties and the wrapper properties: both decide what
      # is downloaded and what can be reused, so either changing invalidates the
      # key rather than serving a classpath built for a different dependency set.
      # The restore-keys fall back to the newest cache for the same wrapper
      # version, which is what makes a single dependency bump a hit rather than
      # a miss.
      - name: Restore the Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontends/android/gradle.properties', 'frontends/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chown "$USER" /dev/kvm
          # The group change only applies to NEW logins, so validate by name.
          if [ ! -e /dev/kvm ]; then echo "no /dev/kvm on this runner"; exit 1; fi

      - name: Install the Android SDK
        run: |
          sdk_root="$HOME/Android/Sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          # The pinned build number, so a runner image refresh cannot change the
          # tools under a green build. This is the same one docs/ENVIRONMENT.md
          # records as installed locally (cmdline-tools 19.0, build 13114758).
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q tools.zip -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" "emulator" \
            "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" \
            "ndk;27.3.13750724" \
            "system-images;android-35;google_apis;x86_64"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Create the AVD
        run: |
          # `pixel_6` matches the profile docs/ENVIRONMENT.md records locally, so
          # the screen is the same size and any coordinates a test derives from a
          # view hierarchy behave the same way here.
          export PATH="$HOME/Android/Sdk/cmdline-tools/latest/bin:$PATH"
          echo no | avdmanager create avd -n hunmin-ci \
            -k "system-images;android-35;google_apis;x86_64" --device pixel \
            -c 512M --force
          echo "HUNMIN_AVD=hunmin-ci" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.config/.android/avd" >> "$GITHUB_ENV"

      - name: Configure host build (for engine tests)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHUNMIN_TRACE_BUILD=ON
      - name: Build host engine (for engine tests)
        run: cmake --build build --target hunmin

      - name: Cross-compile the engine and build the APK
        run: |
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          # BOTH ABIs: the APK declares arm64-v8a and x86_64 in abiFilters, and
          # AGP's externalNativeBuild fails the packaging step if either ABI's
          # libhunmin.so is missing -- so building one is not "half a job", it is
          # a failed one.
          ./tools/build-android.sh x86_64 24
          ./tools/build-android.sh arm64-v8a 24
          cd frontends/android
          ./gradlew --no-daemon assembleDebug

      - name: Tier E0 + E1 (engine on device, adapter in the JVM)
        # No emulator needed for either: E0 pushes the engine and the goldens
        # over adb, and E1 is a JVM test. This step is what catches a broken
        # build before the expensive boot below.
        #
        # Measured 2026-10-14 for issue #59: this is the SECOND run of exactly
        # these two tests -- the linux job ran them at 148.38 s and 84.31 s
        # because the runner image ships an Android SDK the workflow never
        # installs, so the CMakeLists.txt:192 guard fires there too. The linux
        # job's copy is not removed by this change (option A in
        # docs/CI-TIMING.md was measured and left as a maintainer call, because
        # excluding tier E1 from linux makes `linux` green while the android job
        # -- the only other place E1 runs -- is the one that failed at the SDK
        # step in run 38428978810). What IS fixed here is that both copies are
        # now warm: the Gradle cache restored above makes each ~23 s instead of
        # ~148 s.
        run: ctest --test-dir build -j4 -R "engine-android-goldens|engine-android-e1|android-mutations" --output-on-failure

      - name: Free disk space for emulator
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /home/runner
          # Remove unnecessary packages
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/emulator/qemu/linux-x86_64/qemu-system-i386* 2>/dev/null || true
          # Remove docker images if any
          docker system prune -af --volumes 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /home/runner

      - name: Boot the emulator
        run: |
          export PATH="$HOME/Android/Sdk/platform-tools:$HOME/Android/Sdk/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.config/.android/avd"
          echo "Listing AVDs:"
          avdmanager list avd
          "$ANDROID_HOME/emulator/emulator" -avd hunmin-ci \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -memory 1536 &
          EMULATOR_PID=$!
          adb wait-for-device
          # Bounded wait: the script must not hang the job if the image is slow.
          for _ in $(seq 1 60); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 || { echo "Emulator failed to boot"; kill $EMULATOR_PID 2>/dev/null; exit 1; }

      - name: Tier E2 (the APK, typed into with real key events)
        # The assertion is the committed text read out of a real EditText with
        # uiautomator, not anything hunmin logged -- see docs/TESTING.md.
        run: ./tools/android-e2e.sh x86_64

      - name: Tier E2, the Espresso half (issue #13)
        # The instrumentation suite under app/src/androidTest/. It was never
        # compiled before issue #13, so this step is the first CI runner the
        # suite has ever had: it fails if zero tests executed, which is the
        # "green having measured nothing" shape the issue records.
        #
        # On the runner there is no previously-selected IME worth restoring
        # (a fresh AVD), so the script's snapshot/restore is a no-op here.
        run: ./tools/android-espresso.sh

      - name: Emulator log on failure
        # Quoted, and it matters: unquoted, YAML 1.1 parses `failure()` as the
        # boolean True and GitHub rejects the whole workflow with "Invalid
        # workflow file: .github/workflows/ci.yml#L1". Measured 2026-10-13:
        # every CI run since the initial public commit (fbb0c43, 38 runs) failed
        # this way, so no CI job has executed even once.
        if: "${{ failure() }}"
        run: |
          adb logcat -d 2>/dev/null | tail -300 || true

  # Issue #8: the linux job runs ctest and hunmin-doctor; it does not package,
  # and the android job runs assembleDebug. Neither 0.1 artefact was ever built
  # by CI -- the .deb existed only as one local dpkg-buildpackage run and the
  # signed APK only as one local assembleRelease (docs/REMAINING-WORK.md §3).
  #
  # This job builds the .deb. It runs the suite inside the package build
  # (debian/rules override_dh_auto_test) rather than skipping it, because the
  # issue's own verification says a packaging job must not skip the suite.
  #
  # It builds fcitx5 5.1.13 from source first, same as the linux job: the .deb
  # builds the addon, which needs >= 5.1.13 (FCITX_ADDON_FACTORY_V2 /
  # setComment), and Ubuntu 24.04's distro 5.1.7 is below the floor. Without
  # this, debian/rules fails at the addon configure/compile.
  #
  # The failure mode to expect first on a fresh checkout used to be
  # data-selfcheck red without the gitignored krdict dump (REMAINING-WORK.md
  # §0). 2026-10-17 (maintainer instruction): the test was unregistered — it
  # is not touched before its own dev stage, and on the Windows host the
  # converter-vs-committed-data divergence was red on every pass. The suite
  # here is expected fully green now; krdict-fixture guards the converter's
  # logic self-contained.
  deb:
    name: debian (.deb artefact)
    # needs: linux -- this job no longer builds fcitx5 5.1.13 from source; it
    # restores the install tree the linux job uploads. Measured 2026-10-14 for
    # issue #59: the two source builds were 197 s and 326 s of workflow wall
    # clock for the same artefact, 523 s with nothing shared.
    #
    # The dependency is real and not just an ordering hint: a deb run without a
    # successful linux run has no artefact to download and fails at the restore
    # step, which is the honest failure for "the thing this needs was not
    # built". The old independent form let a broken linux build pass as a red
    # linux job with a green deb job built from its own private fcitx5 -- two
    # jobs asserting different things about the same dependency.
    needs: linux
    # DISABLED 2026-11-01 -- see the header. Re-enable with
    # `if: github.event_name != 'push'` (the PR rung and above:
    # dpkg-buildpackage is packaging, not the per-commit gate).
    if: false
    runs-on: ubuntu-24.04
    # NOT 5 minutes, and the reason is measured rather than cautious. This job
    # took 13 m 30 s in run 38428978810 (docs/CI-TIMING.md §1): fcitx5 source
    # build 326 s + dpkg-buildpackage 460 s + apt 23 s. A 5-minute ceiling here
    # would not constrain the job, it would kill it -- which is a different
    # failure from a slow one and would read as a packaging regression.
    #
    # The path to 5 minutes is the 326 s duplicate fcitx5 build: it already
    # restores the linux job's install tree as an artefact (see the restore
    # step below), so that 326 s is paid only on a cache miss, and the 460 s
    # dpkg-buildpackage is the real floor. 45 minutes stays until that floor is
    # measured again on the cached path; the number is a budget, not a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libhangul-dev \
            build-essential \
            python3 debhelper fakeroot extra-cmake-modules gettext \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-util-dev libxcb-xkb-dev libxcb-xfixes0-dev \
            libxcb-icccm4-dev libxcb-xinerama0-dev libxcb-randr0-dev \
            libxcb-ewmh-dev libxcb-keysyms1-dev libxcb-imdkit-dev \
            libxcb-util0-dev libxcb-image0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-cursor-dev \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libexpat1-dev libxkbfile-dev \
            libjson-c-dev libdbus-1-dev libuv1-dev uuid-dev \
            libwayland-dev wayland-protocols libxdo-dev libevent-dev libfmt-dev \
            iso-codes xkb-data
      # The fcitx5 install tree, restored rather than rebuilt. Measured
      # 2026-10-14 for issue #59: this job built the same 5.1.13 from source as
      # the linux job, 326 s here against 197 s there, 523 s of workflow wall
      # clock for one artefact. The linux job uploads it and this restores it.
      #
      # The restore is a sequence, not a cache: actions/cache@v4 is scoped to a
      # job and cannot be shared between jobs, while an artefact can. The linux
      # job's upload is the same tree under the same name.
      #
      # What the restore must preserve, because debian/rules depends on it:
      # dh_shlibdeps reads dpkg's database to resolve what the addon links, and a
      # source-built fcitx5 owns no package. debian/rules:82-83 already passes
      # --ignore-missing-info, which holds only if the restored tree lands in
      # the same paths. A restore into /usr/lib/x86_64-linux-gnu and
      # /usr/include/Fcitx5 is byte-identical in what it puts where, so the
      # check that it worked is the next step's own output: the addon must
      # configure against the restored Fcitx5CoreConfig.cmake.
      - name: Restore the fcitx5 5.1.13 install tree (built by the linux job)
        uses: actions/download-artifact@v4
        with:
          name: fcitx5-5.1.13-install
          path: /tmp/fcitx5-install
      - name: Install the restored fcitx5 into /usr
        run: |
          # A restore that lost the cmake configs would fail the next step with
          # "Fcitx5Core not found", which reads like a build problem rather than
          # a restore problem. Check here, where the cause is visible.
          test -d /tmp/fcitx5-install/usr/lib/x86_64-linux-gnu/cmake/Fcitx5Core \
            || { echo "restore is missing Fcitx5Core cmake configs" >&2; exit 1; }
          sudo cp -a /tmp/fcitx5-install/usr/. /usr/
          sudo ldconfig
          pkg-config --modversion Fcitx5Core
      # Same cache as the linux job, same reason and the same measurement: this
      # job's suite carries 324 s of tier E1 (engine-android-e1 185.68 s plus
      # android-mutations 138.45 s, run 38428978810's deb job log), all of it
      # cold-Gradle. As of 2026-10-14 the tier-E1 tests are excluded from the
      # package build -- see debian/rules' override_dh_auto_test -- so what this
      # cache now serves is android-trace-emit.sh's Gradle classpath for the
      # tier-C Android corpus (16 -> 15 tests after the duplicate registration
      # was removed) plus frontend-mutations' sandbox builds. The cache is kept
      # because the classpath materialisation is still a Gradle invocation, and
      # because the exclusion above is a packaging decision that could be
      # revisited, at which point this is what makes the difference between
      # 324 s and 25 s.
      - name: Restore the Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontends/android/gradle.properties', 'frontends/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install pyright (debian/rules runs docs-lint, which asserts tools/ is clean)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install pyright
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the .deb
        # -us -uc unsigned: a key is not required to build the artefact, and
        # requiring one would make it unbuildable on a machine without one --
        # the exact "only one machine can produce the release" property the
        # issue is about. -b binary-only, same path as the local run.
        #
        # -d (ignore build-deps): fcitx5 was built from source into /usr above
        # (no .deb package), so dpkg-checkbuilddeps sees no libfcitx5core-dev
        # package and would abort with "Unmet build dependencies" -- measured on
        # CI 2026-10-13. The dependency is genuinely satisfied (the headers and
        # cmake configs are installed); -d tells dpkg to trust the source build
        # rather than package metadata. Safe here because the source-build step
        # above is the one that provides it.
        run: dpkg-buildpackage -us -uc -b -d
      - name: What the package contains
        run: |
          deb="$(ls ../hunmin_*_*.deb)"
          dpkg-deb --info "$deb" | sed -n '1,4p'
          # Through a file, not a pipe into head: closing the pipe early makes
          # tar die on EPIPE and dpkg-deb print "tar subprocess returned error
          # exit status 2" (measured 2026-10-13), which reads like a broken
          # package. The file also gives the step a real exit status -- piped
          # into head, the status was head's, so an unreadable .deb passed.
          dpkg-deb --contents "$deb" > /tmp/hunmin-deb-contents.txt
          head -20 /tmp/hunmin-deb-contents.txt
      - name: Stage the .deb inside the workspace
        # upload-artifact@v4 refuses any pattern containing `..`, measured on
        # this job: "Invalid pattern '../hunmin_*_*.deb'. Relative pathing '.'
        # and '..' is not allowed." dpkg-buildpackage always writes one level
        # above the source tree, so the file is copied in rather than reached
        # at. This was the step that failed once the shlibdeps fix let the
        # build finish.
        run: |
          mkdir -p artifacts
          cp ../hunmin_*_*.deb artifacts/
          ls -la artifacts/
      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: hunmin-deb
          path: artifacts/hunmin_*.deb
          retention-days: 30

  # The signed release APK, and the reason it is gated on a repository
  # variable and produces a throwaway signature.
  #
  # B8 (issue #1) was decided 2026-10-13: build.gradle.kts reads
  # HUNMIN_RELEASE_STORE, else a gitignored local.properties, else generates a
  # throwaway key at build time. This job takes the first route with a
  # throwaway key of its own, written to RUNNER_TEMP and never into the tree --
  # so it proves the release BUILD works, not that the release SIGNATURE does.
  # When a real release key exists, this job is where it would be wired in:
  # point HUNMIN_RELEASE_STORE at it instead of generating one.
  android-release:
    name: android release APK (unsigned keystore)
    # DISABLED 2026-11-01 -- see the header. The gate it had was
    #   github.event_name == 'push' && github.ref == 'refs/heads/master' &&
    #   vars.HUNMIN_BUILD_RELEASE == 'true'
    if: false
    runs-on: ubuntu-24.04
    # NOT 5 minutes: installs the Android SDK and NDK from the network, then
    # builds a release APK for two ABIs through Gradle. Same shape as the
    # android job's SDK step -- an unbounded-by-cache network download. Gated
    # on master + an opt-in variable, so it does not run on a PR at all; the
    # ceiling exists so a hung Gradle cannot bill indefinitely.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android SDK
        run: |
          sdk_root="$HOME/Android/Sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q tools.zip -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.3.13750724"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Generate a throwaway release keystore
        # Not a real release key. B8 was decided 2026-10-13 (local.properties,
        # HUNMIN_RELEASE_STORE override, throwaway-key fallback); this job
        # takes the override with a key of its own, so assembleRelease runs
        # end-to-end without borrowing the debug keystore and without writing a
        # keystore into the tree.
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass android -alias hunmin -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=hunmin-ci,O=hunmin,L=CI,C=KR'
          echo "HUNMIN_RELEASE_STORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the release APK (arm64-v8a + x86_64)
        # Both ABIs: the APK declares both in abiFilters, and AGP fails the
        # packaging step if either ABI's libhunmin.so is missing.
        run: |
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          ./tools/build-android.sh arm64-v8a 24
          ./tools/build-android.sh x86_64 24
          cd frontends/android
          ./gradlew --no-daemon :app:assembleRelease
      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: hunmin-release-apk
          path: frontends/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  mingw:
    # Enabled with the PR rung (2026-11-01, instruction quoted at the top of this
    # file). No `if:` on purpose: it runs on push, pull request, the nightly and
    # by hand -- it is a cross-compile, so it is the cheapest thing this workflow
    # can say about a commit.
    runs-on: ubuntu-24.04
    # 3 minutes, matching the linux job's ceiling. This job cross-compiles one
    # target (`--target hunmin`) and builds no tests, so it has no ctest step to
    # bound; the ceiling is here so a hung compiler cannot bill indefinitely,
    # not to make it fit.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build mingw-w64
      - run: cmake -B build -G Ninja --toolchain cmake/toolchain-mingw-w64.cmake -DBUILD_TESTING=OFF
      - run: cmake --build build --target hunmin

  # DISABLED -- issue #51, the maintainer's words:
  #
  #   "for windows, it is not scope of this version. so in the issue we will
  #    disable windows test."
  #
  # There is no Windows frontend to test: `ls frontends/` is `android fcitx5`,
  # and AGENTS.md says a Windows TSF frontend "is planned and does not exist
  # yet". The fcitx5 addon is not built here either -- it prints "Fcitx5Core not
  # found: fcitx5 addon disabled" -- so this job asserts one thing only: that
  # the core shared library compiles under MSVC. That is not a shipped 0.1
  # artefact, which is what the ruling scopes out.
  #
  # It was red on master before this, unconditionally and since at least 0d046bc:
  #
  #   cl : command line error D8021: invalid numeric argument '/Wextra'
  #     [D:\a\hunmin\hunmin\build\hunmin.vcxproj]
  #
  # because CMakeLists.txt:10 `add_compile_options(-Wall -Wextra)` is passed to
  # cl, which has no -Wextra, so the job dies before compiling a line. The
  # `mingw` job builds the same --target hunmin under GCC and passes.
  #
  # `if: false` and not a deleted block: a deleted job cannot answer "was
  # Windows ever built here, and why did it stop". The /Wextra flag is
  # deliberately NOT guarded with if(NOT MSVC) -- that would turn the job
  # green, which is a different decision from the one that was ruled; if MSVC
  # support is wanted later it is its own issue with its own measurement. No
  # other job references this one, so nothing here depends on it.
  windows:
    # NOT part of the 2026-11-01 disablement: this job was ruled out by issue #51
    # (no Windows frontend exists) and its reason is below. Raising it is that
    # issue's decision, not this instruction's.
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A x64 -DBUILD_TESTING=OFF
      - run: cmake --build build --target hunmin --config RelWithDebInfo

  # Tier E4: nightly soak / fuzz with LeakSanitizer
  # Runs nightly at 03:00 UTC. Builds with LeakSanitizer, generates random
  # HW-key streams via the existing mutation harness, and auto-files crashes
  # as GitHub issues with reproduction steps.
  nightly-fuzz:
    name: nightly fuzz (LeakSanitizer)
    # DISABLED 2026-11-01 -- see the header. Re-enable with
    # `if: github.event_name == 'schedule'`.
    if: false
    runs-on: ubuntu-24.04
    # NOT 5 minutes, and structurally cannot be: the loop below runs 10,000
    # fuzz iterations, each a hunmin-sim invocation. This is a nightly soak, not
    # a PR gate -- `if: github.event_name == 'schedule'` means a push pays
    # nothing for it, so the cost concern that bounds the other jobs does not
    # apply here in the same way. The ceiling is a runaway guard: without one,
    # a hang in iteration 1 bills until GitHub kills it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build pkg-config libhangul-dev python3 \
            fcitx5-modules-dev libasan8 liblsan0

      - name: Configure with LeakSanitizer
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHUNMIN_TRACE_BUILD=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,leak -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,leak -fno-omit-frame-pointer"

      - name: Build with LeakSanitizer
        run: cmake --build build -j16

      - name: Run engine fuzz (random HW-key streams, 10000 iterations)
        run: |
          cd build
          for i in $(seq 1 10000); do
            # Generate random valid key sequence from the layout tables
            python3 ../tools/fuzz-generate-keys.py --layout sin3-p2 --len 50 \
              | ../build/hunmin-sim --data ../libhunmin/data --layout sin3-p2 --trace \
              > /tmp/fuzz-$i.trace 2>&1 || {
                echo "FAIL: fuzz iteration $i crashed"
                cat /tmp/fuzz-$i.trace
                # Create GitHub issue with reproduction steps
                gh issue create --title "Fuzz crash: iteration $i" \
                  --body "$(cat /tmp/fuzz-$i.trace)" \
                  --label "fuzz,crash,auto-filed" || true
                exit 1
              }
            # Check for LeakSanitizer reports in stderr
            if grep -q "LeakSanitizer" /tmp/fuzz-$i.trace; then
              echo "FAIL: LeakSanitizer reported leak in iteration $i"
              cat /tmp/fuzz-$i.trace
              gh issue create --title "LeakSanitizer leak: iteration $i" \
                --body "$(cat /tmp/fuzz-$i.trace)" \
                --label "fuzz,leak,auto-filed" || true
              exit 1
            fi
          done

      - name: Run Android mutation fuzz (LeakSanitizer)
        if: false
        run: |
          # Disabled until Android emulator supports LeakSanitizer reliably
          # export ASAN_OPTIONS=detect_leaks=1
          # python3 tools/android-mutations.py --strategy sandbox

      - name: Upload fuzz artifacts on failure
        if: "${{ failure() }}"
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: /tmp/fuzz-*.trace
          retention-days: 30