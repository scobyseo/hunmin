name: ci
# WHAT RUNS RIGHT NOW. On 2026-11-01 the maintainer said
#
#   "now enable mingw test only, and disable all others until i request."
#
# and then
#
#   "let's disable commit test too. only pr-test is enough."
#
# so exactly two jobs ran -- `mingw` (a cross-compile) and `linux` on a pull
# request (the PR rung, `ctest -LE tier-E1`) -- and every other job carried
# `if: false` with its previous condition in a comment beside it.
#
# UPDATE 2026-11-22 (issue #292, maintainer request): packaging jobs are
# activated again, but on the NIGHTLY rung only, so a PR does not pay for them.
# `deb` builds the noble artefact and `ibus-jammy` builds the 22.04 artefact on
# a real ubuntu-22.04 runner and runs the IBus D1/D2/D3 lanes there. `linux`
# runs on nightly too. (Before issue #322 `deb` needed linux's fcitx5 install-tree
# artefact and that was the nightly coupling; both jobs now install the distro
# fcitx5 independently, so the coupling is gone.)
# The two artefacts have different dependency sets by ruling (IBus 1.5.26, no
# fcitx5, for jammy). The other jobs stay `if: false`.
#
# THERE IS NO COMMIT RUNG IN CI, by the second instruction. docs/TESTING.md's
# commit level (`ctest -L guard`, 19.4 s on the reference host) stays a LOCAL
# selection -- that is where a sub-minute gate belongs and how it is meant to be
# run, and the PR rung contains it anyway.
#
# NOTHING HERE RUNS TODAY: issue #102 is the account-level Actions billing
# failure, and every job it starts dies in about three seconds with "job was not
# started because recent account payments have failed or your spending limit
# needs to be increased". So the set below is what runs when #102 is fixed, not
# evidence about the tree in the meantime -- and which set that should be is the
# maintainer's call after #102, not this file's.
#
# The ladder these jobs belong to is docs/TESTING.md §"The three levels"
# (commit < PR < nightly == release). When they are all on again, the routing is:
#
#   push              nothing -- the commit rung is a local selection
#   pull_request      the PR rung -- linux (`-LE tier-E1`) and mingw only
#   schedule          nightly -- linux (for the fcitx5 artefact), deb (noble
#                     artefact), ibus-jammy (22.04 artefact + IBus D1/D2/D3),
#                     and mingw. The release APK and fuzz jobs stay disabled.
#   workflow_dispatch everything, by hand
#
# Before 2026-11-01 every push paid all of it: 45 min (android), 45 min (deb) and
# 3 min (linux) against a commit rung whose own budget is under a minute. That
# budget is docs/TESTING.md's ("the commit rung has to be under a minute, or it
# stops being run"), not a new one; the unit costs are docs/CI-TIMING.md's.
on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    # 3 minutes, set 2026-10-15. The job measured 8 m 24 s before this
    # (docs/CI-TIMING.md §1); the 5-minute ceiling set the same day was met by
    # excluding tier E1 (ctest 269 s -> ~37 s). The remaining 197 s segment was
    # the fcitx5 source build, which a cache made fit on a HIT but which made a
    # MISS a guaranteed timeout.
    #
    # Issue #322 removed that segment outright: the addon's API floor is now
    # 5.1.7 (V1 factory export + a version-guarded setComment), which is exactly
    # what ubuntu-24.04 ships, so the job installs the DISTRO fcitx5 via apt and
    # there is no source build and no cache to miss. The cold path is now the
    # only path, and it fits: apt + cmake/build + ctest, with no 197 s build
    # hanging off a cache hit (docs/CI-TIMING.md §5; the dispatch measurement is
    # the verification, not a local guess).
    #
    # CI minutes are a cost, and a job with no ceiling is a job whose cost is
    # unbounded -- the same overspend shape that got CI usage suspended, one
    # level down.
    timeout-minutes: 15
    # THE PR RUNG, and the only TEST job that runs (2026-11-01, the instructions
    # quoted at the top of this file): `ctest -LE tier-E1` on a pull request.
    # A push now runs nothing at all. Also runs on nightly (2026-11-22); the
    # `deb` job no longer needs an install-tree artefact from this job (issue
    # #322: both install the distro fcitx5), so the nightly coupling is gone.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v7
      # fcitx5-modules-dev carries Fcitx5Utils/Fcitx5Module cmake configs, which
      # the addon and tier C's trace emitter both need; without it the fcitx5
      # frontend is silently dropped and 104 conformance tests never register,
      # which reads as "green" while testing nothing.
      #
      # MEASURED 2026-10-13 (issue #8), two separate findings:
      #
      # 1. The workflow file itself was invalid -- the android job carried a
      #    job-level `paths:` (a trigger filter, not a job property), so GitHub
      #    rejected the whole file and NO job ever ran on any commit. The
      #    android path filter is now a job-level `if:` (see that job); the
      #    `if: failure()` quoting fixed alongside was a real but separate
      #    latent YAML-1.1 boolean bug.
      #
      # 2. The addon's API floor is 5.1.7 (issue #322): the V1 factory export
      #    loads on every fcitx5 from 5.1.7 up, and CandidateWord::setComment
      #    (5.1.9+) is version-guarded with an auxDown fallback below it. Ubuntu
      #    24.04's distro fcitx5 IS 5.1.7, so the addon now configures and
      #    compiles against the distro package -- no source build. The shipped
      #    .deb requires fcitx5 (>= 5.1.7), so a 24.04 user installs against the
      #    distro fcitx5, not a source-built one.
      - name: Install build deps
        run: |
          sudo apt-get update
          # python3-pil: pyright resolves imports against the interpreter it
          # inspects (the system python3). `uv tool install --with pillow pyright`
          # does NOT do that -- measured in a 24.04 VM on 2026-11-09: the tool env
          # had Pillow and pyright still reported
          # `Import "PIL" could not be resolved` at tools/gen-android-icons.py:33.
          # With this package the import resolves.
          sudo apt-get install -y cmake ninja-build pkg-config libhangul-dev \
            python3 python3-pil libxkbcommon-dev libx11-dev libibus-1.0-dev
          # The distro fcitx5 (issue #322), installed WITHOUT recommends: the
          # frontend stack (fcitx5-frontend-all -> gtk2/3/4/qt5/6, config-qt) is
          # a Recommends of `fcitx5` and no lane that runs here needs it (D3
          # skips on the headless runner). --no-install-recommends is scoped to
          # THIS line so it cannot drop, e.g., the dbus session bus the IBus D2
          # lane needs from the line above.
          sudo apt-get install -y --no-install-recommends \
            libfcitx5core-dev fcitx5-modules-dev fcitx5-modules fcitx5
          # Why this is the whole list (issue #322 prune; the rest of the old
          # list was the fcitx5 SOURCE build's deps, removed with the source
          # build). Each kept package is load-bearing:
          #   libhangul-dev      core + parity tests
          #   libxkbcommon-dev   xkbcommon.pc for the D3 XIM harness (D3_XKB)
          #   libx11-dev         find_package(X11) so D3 REGISTERS (then skips on
          #                      the headless runner). It used to arrive
          #                      transitively via the removed -dev packages;
          #                      without it X11 is not found and the 9 D3 tests
          #                      silently vanish from the count (measured:
          #                      176 -> 167). Explicit is the honest form.
          #   libibus-1.0-dev    IBus frontend lanes (the #292 note below)
          #   python3-pil        pyright resolves PIL against system python3
          #   fcitx5 stack       cmake configs (addon + tier C), TestFrontend
          #                      (D1/D2), runtime + data. fcitx5-modules'
          #                      Depends already pulls libxcb-imdkit1, libxcb1,
          #                      libxkbcommon0 and the xcb/cairo/pango runtimes
          #                      that D3's find_file needs, so no -dev versions
          #                      of those are required.
          # ECM / gettext / libfmt-dev are NOT needed: Fcitx5CompilerSettings
          # is pure flag-setting and the fcitx headers include no fmt/ (the
          # 5.1.7 addon build compiled with no fmt include path). The prune is
          # verified by the registration gate below (a silently dropped lane is
          # this workflow's recorded failure mode, issue #292), not assumed.
          # libibus-1.0-dev is what makes the IBus engine lanes REGISTER on
          # this job. Measured in issue #292 (PR #311's run 44981702310): the
          # apt list above lacked it, so pkg_check_modules(ibus-1.0>=1.5.26)
          # failed, all of frontends/ibus/ was dropped, and the job's 142
          # tests included no engine-d1-ibus / engine-d1-ibus-judgement /
          # engine-d2-ibus-ui -- a green run that asserted nothing about the
          # 22.04 release's only frontend. 1.5.29-2 in noble universe is
          # above the tree's 1.5.26 floor; the ubuntu-24.04 image has
          # universe enabled. The lanes must register AND pass, not skip:
          # engine-d2-ibus-ui needs a session bus and SKIPs without one.
      # fcitx5 comes from the distro packages installed above (issue #322).
      # The 5.1.13 source build, its install-tree cache and the artefact upload
      # that fed the deb job are gone: the addon's floor is 5.1.7, which noble
      # ships, so there is nothing to build and nothing to cache. The 197 s
      # cold-build segment that made a cache MISS a guaranteed timeout no longer
      # exists (docs/CI-TIMING.md §5).
      # The Gradle cache, measured 2026-10-14 for issue #59. This job is the one
      # the measurement is about: its ctest ran engine-android-e1 at 148.38 s and
      # android-mutations at 84.31 s, and 126.24 s of the first of those is cold
      # Gradle -- measured by emptying GRADLE_USER_HOME, against 22.95 s warm.
      # The cache that makes the difference is wrapper/dists (143 MB),
      # caches/modules-2 (394 MB) and caches/build-cache-1 (124 MB).
      #
      # This job needs it for the same reason the android job does, and the
      # reason is not obvious: it runs the Android tiers at all only because the
      # runner IMAGE ships an Android SDK this workflow never installs (the
      # Ubuntu 24.04 image's ANDROID_HOME and the exact NDK this repo pins), so
      # the CMakeLists.txt:192 guard fires and engine-android-e1 / android-mutations
      # / the tier-C Android corpus all run here. The android job then re-runs the
      # same two tests at ci.yml, which is why the cache is shared with it: the
      # same key in both jobs means the second one to run restores what the first
      # populated.
      #
      # Keyed on gradle.properties and the wrapper properties: both decide what
      # is downloaded and what can be reused, so either changing invalidates the
      # key rather than serving a classpath built for a different dependency set.
      # The restore-keys fall back to the newest cache, so a single dependency
      # bump is a hit rather than a miss.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontends/android/gradle.properties', 'frontends/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install pyright (docs-lint asserts tools/ is clean)
        # The M5-CLOSED assertion row runs `pyright tools/` inside docs-lint;
        # without the tool it fails with FileNotFoundError (measured on CI
        # 2026-10-13), not a code defect. Install it so the assertion is real.
        #
        # Pillow is provided by the apt step above, not by `--with pillow`, and
        # that distinction was measured on 2026-11-09 in a 24.04 VM: pyright
        # resolves imports in the interpreter it inspects, so a Pillow inside the
        # tool environment changes nothing (still
        # `error: Import "PIL" could not be resolved` at
        # tools/gen-android-icons.py:33), while python3-pil makes it resolve.
        # Once it resolved it reported a REAL type error at
        # tools/gen-android-icons.py:88 (a colour tuple against Pillow 10.2's
        # `color: int` stub), which is fixed in the same branch -- the M5 row
        # had been asserting "clean" against an import failure.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install pyright
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHUNMIN_TRACE_BUILD=ON
      - run: cmake --build build -j4
      # The environment snapshot, taken BEFORE ctest and unconditionally.
      #
      # WHY FIRST. A red run whose cause is environmental -- a tier that did
      # not register, a tool the runner image lacks, a data input that is
      # absent -- cannot be reproduced locally without knowing what the runner
      # actually had, and finding out by re-running CI is a CI minute spent on
      # diagnosis. Two measured instances of exactly that: tier D3 is Skipped
      # here because the image ships no xvfb, and tier E1 registers only
      # because the image ships an Android SDK the workflow never installs
      # (docs/CI-TIMING.md §1). Neither is visible in a pass/fail summary.
      #
      # Unconditional rather than `if: failure()`, so the snapshot survives a
      # hard abort that skips later steps, and so a green run's snapshot can
      # be diffed against a red one. tools/ci-env-snapshot.sh is the local
      # equivalent -- run it here and the two outputs are directly comparable.
      - name: Snapshot the environment (before ctest, always)
        # The Gradle cache outcome is passed in: it is the one fact that
        # explains a job taking ~126 s longer than the run before it, and it is
        # not visible from inside the tree. (The fcitx5 cache outcome used to be
        # passed too; issue #322 removed the fcitx5 source build and its cache.)
        env:
          HUNMIN_CI_CACHE_GRADLE: ${{ steps.gradle-cache.outputs.cache-hit || 'miss' }}
        run: ./tools/ci-env-snapshot.sh build | tee ci-env-snapshot.txt
      # -j4, measured 2026-10-14 for issue #59. On this host the same suite is
      # 189.76 s serial and 47.82 s at -j16, and the serial ctest alone is 269 s
      # of this job's 504 s. The three heavyweight tests cap the gain: ctest's
      # RUN_SERIAL on engine-android-e1 is honoured by -j, and android-mutations
      # is nine sequential tools/android-unit.sh runs, so at most one of them
      # can overlap frontend-mutations. Measured locally on the trio itself,
      # 113.46 s serial -> 67.15 s at -j4.
      #
      # NOT -j16: the runner has 4 cores, and the repo has been bitten by
      # oversubscription before -- fourteen conformance tests deleting each
      # other's R-def.txt under -j16 is recorded in tools/android-trace-emit.sh's
      # header comment, which is why that script guards its Gradle classpath
      # with a flock. -j4 matches the runner's actual parallelism.
      #
      # -LE 'tier-E1', added 2026-10-15 to fit the 5-minute ceiling above.
      # Option A of docs/CI-TIMING.md §3, measured there: linux's ctest goes
      # from 269 s to about 37 s and the job from 504 s to about 235 s.
      # What it costs is stated in that section and not repeated here: the
      # linux job stops being a second place the Android adapter is proved to
      # pass, which matters only while the android job is the red one. The
      # android job runs exactly `engine-android-goldens|engine-android-e1|
      # android-mutations` at its "Tier E0 + E1" step, so the coverage is not
      # lost, it is de-duplicated. The tier-C Android corpus is NOT excluded
      # -- it registers under `tier-C`, and this job is where it runs.
      # --output-junit IS RESOLVED AFTER ctest CHANGES INTO --test-dir. Measured 2026-11-09
      # (ctest 4.4.4, a two-test project): `ctest --test-dir build --output-junit
      # build/junit.xml` writes `build/build/junit.xml`, so the relative path that reads
      # naturally here created nothing at `build/junit.xml`. The whole chain below then
      # reported "no JUnit output to summarise" and the failure-evidence artefact silently
      # dropped the one file it exists to carry -- on a run whose 141 tests had in fact all
      # been recorded. An absolute path is used so this line and the artefact list below
      # cannot drift apart again, and a missing file now fails the step: a harness defect
      # that eats the evidence is not the same thing as a red test, which is the only thing
      # `|| true` is here to suppress.
      - run: |
          ctest --test-dir build -j4 --output-on-failure -LE 'tier-E1' \
            --output-junit "$GITHUB_WORKSPACE/build/junit.xml" || true
          echo "=== ctest finished (exit suppressed) ==="
          test -f "$GITHUB_WORKSPACE/build/junit.xml" || {
            echo "::error::JUnit output missing at build/junit.xml -- the timing summary and the failure-evidence artefact both read it"
            exit 1
          }
          ls -la build/junit.xml
          head -100 build/Testing/Temporary/LastTest.log 2>&1 || true
      # The IBus lanes must REGISTER and PASS, not be silently absent. ctest's
      # exit code is suppressed above, so this reads the JUnit that step wrote.
      # issue #292: a run with 142 green tests and zero engine-*-ibus names is
      # not evidence about 22.04's only frontend; a SKIP of engine-d2-ibus-ui
      # (no session bus) is likewise not a pass. Fail the job if any of the
      # three lanes is missing, skipped or failed.
      - name: IBus + fcitx5 lanes registered and passed (a skip is not a pass)
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("build/junit.xml").getroot()
          cases = {c.get("name"): c for c in root.iter("testcase")}
          expected = [
              "engine-d1-ibus",
              "engine-d1-ibus-judgement",
              "engine-d2-ibus-ui",
              # fcitx5 lanes (issue #322): the apt prune must not silently drop
              # them. If Fcitx5Core were not found the addon would be disabled
              # at configure and these would vanish from a still-green run.
              "engine-d1-fcitx5",
              "engine-d1-judgement",
              "engine-d2-ui",
          ]
          bad = []
          for name in expected:
              c = cases.get(name)
              if c is None:
                  bad.append(name + ": not registered")
                  continue
              if c.get("status") != "run" or c.find("skipped") is not None or c.find("failure") is not None:
                  bad.append(name + ": status=" + str(c.get("status")))
          # The tier-C IBus lanes (issue #316) register under
          # HUNMIN_TRACE_BUILD=ON, which this job sets: the same x11 corpus
          # the fcitx5 lane replays, through the IBus key path. Counted by
          # prefix because the names are generated from the corpus filenames.
          ibus_c = [c for n, c in cases.items() if n.startswith("conformance-ibus-")]
          if not ibus_c:
              bad.append("conformance-ibus-*: not registered")
          for c in ibus_c:
              if c.get("status") != "run" or c.find("skipped") is not None or c.find("failure") is not None:
                  bad.append(c.get("name") + ": status=" + str(c.get("status")))
          # The tier-C fcitx5/x11 lanes, same rationale (issue #322 prune guard).
          fcitx_c = [c for n, c in cases.items() if n.startswith("conformance-tests_conformance_x11")]
          if not fcitx_c:
              bad.append("conformance-tests_conformance_x11*: not registered")
          for c in fcitx_c:
              if c.get("status") != "run" or c.find("skipped") is not None or c.find("failure") is not None:
                  bad.append(c.get("name") + ": status=" + str(c.get("status")))
          if bad:
              print("::error::IBus + fcitx5 lanes did not register and pass: " + "; ".join(bad))
              sys.exit(1)
          print("IBus + fcitx5 lanes registered and passed: " + ", ".join(expected))
          PY
      # ctest's own exit code is suppressed so all tests run and are recorded
      # (JUnit + timing) regardless of pass/fail; the IBus gate above and the
      # job-level timeout-minutes are what can fail the job. Keeping ctest's raw
      # status out of the job result lets the timing and failure-evidence steps
      # below always run, so a red run still leaves its measurement behind.
      # WHERE THE TIME WENT, on every run, not only a red one. A green run that
      # took three times as long as the previous one is the finding, and the
      # ctest log answers it only in the middle of several hundred lines. This
      # reads the JUnit output and prints the slowest tests plus the skipped
      # list, and appends the same table to the run's summary page -- so the
      # judgement is available without downloading the artefact.
      - name: Where the time went (always)
        if: always()
        run: python3 tools/ci-test-timing.py --junit build/junit.xml --summary "$GITHUB_STEP_SUMMARY"
      # On failure, keep the evidence. The snapshot above says WHAT the runner
      # had; this keeps it together with the per-test output, so a local
      # reproduction starts from both instead of from a re-run. Uploaded as an
      # artefact rather than printed, because the log is where the failure
      # detail already is and the artefact is what survives to be downloaded.
      - name: Upload the failure evidence
        # failure() OR cancelled(): on a timeout the run is CANCELLED -- where
        # `failure()` is false, so the one artefact that would explain the
        # timeout was never uploaded. Measured here: a timed-out step does not
        # satisfy failure(). (The 3-minute ceiling's old stated failure mode --
        # a cold fcitx5 cache returning the 197 s build -- is gone with the
        # source build, issue #322; the guard stays for any other timeout.)
        if: "failure() || cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: linux-failure-evidence
          path: |
            ci-env-snapshot.txt
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/Testing/Temporary/LastTestsSkipped.log
            build/junit.xml
          retention-days: 7
          if-no-files-found: warn

  # P5's gate is "HW keyboard e2e on emulator CI", and until this job existed
  # the Android tiers could only be reached by hand. It covers three of the four
  # -- E0 (engine on device), E1 (adapter against the real engine) and E2 (the
  # APK typed into with real key events) -- plus the mutation self-test that
  # proves E1 can fail at all.
  android:
    name: android (emulator)
    # A system-image download plus a boot, so it runs only for changes that can
    # actually break it. A docs-only commit must not pay for an AVD -- and
    # "only runs sometimes" is a property worth stating, because the P5 gate
    # depends on this job running at all.
    #
    # The path filter is a JOB-LEVEL `if:`, not a `paths:` filter. Two reasons,
    # both measured 2026-10-13 (issue #8):
    #   - A job-level `paths:` is not a valid job property; it makes GitHub
    #     reject the WHOLE workflow file at parse, so no job ran on any commit
    #     since the initial public one. (That was the first version here.)
    #   - Moving `paths:` up to on.push fixed the parse but gated the ENTIRE
    #     workflow on Android-relevant paths -- so a debian/rules or tools/*.py
    #     change skipped linux/deb/mingw/windows too, which is exactly the
    #     "green CI is compatible with a broken release build" failure the issue
    #     is about. (Measured: two commits touching tools/android-mutations.py
    #     and debian/rules triggered no run at all.)
    # DISABLED 2026-11-01 -- see the header. Re-enable with the expression this
    # replaced:
    #   github.event_name != 'push' &&
    #   (!cancelled() && !contains(github.event.head_commit.message, '[skip android]'))
    # An AVD boot is the most expensive thing this workflow does, and the Espresso
    # E2 tier depends on this job, so the PR rung is where it belongs.
    if: false
    runs-on: ubuntu-24.04
    # NOT 5 minutes: this job downloads the Android SDK, creates an AVD, boots
    # an emulator and runs two instrumentation suites inside it. The SDK install
    # alone is a multi-minute network step that no caching removes. A 5-minute
    # ceiling would kill the job before the emulator boots, and the P5 gate
    # ("HW keyboard e2e on emulator CI") is exactly what this job exists for.
    # 45 minutes is the measured budget for that whole sequence.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle cache, measured 2026-10-14 for issue #59: tools/android-unit.sh
      # takes 126.24 s against an empty GRADLE_USER_HOME and 22.95 s against this
      # host's warm one, and the cache that makes the difference is wrapper/dists
      # (143 MB), caches/modules-2 (394 MB) and caches/build-cache-1 (124 MB).
      # android-mutations then runs the same script nine times. The CI logs
      # measure the cold figure directly -- engine-android-e1 at 148.38 s here
      # and 185.68 s in the deb job, against 23 s warm -- and until this step
      # existed no job in this workflow cached any of it
      # (`grep -rn 'actions/cache' .github/workflows/ci.yml` returned nothing).
      #
      # Keyed on gradle.properties and the wrapper properties: both decide what
      # is downloaded and what can be reused, so either changing invalidates the
      # key rather than serving a classpath built for a different dependency set.
      # The restore-keys fall back to the newest cache for the same wrapper
      # version, which is what makes a single dependency bump a hit rather than
      # a miss.
      - name: Restore the Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontends/android/gradle.properties', 'frontends/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chown "$USER" /dev/kvm
          # The group change only applies to NEW logins, so validate by name.
          if [ ! -e /dev/kvm ]; then echo "no /dev/kvm on this runner"; exit 1; fi

      - name: Install the Android SDK
        run: |
          sdk_root="$HOME/Android/Sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          # The pinned build number, so a runner image refresh cannot change the
          # tools under a green build. This is the same one docs/ENVIRONMENT.md
          # records as installed locally (cmdline-tools 19.0, build 13114758).
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q tools.zip -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" "emulator" \
            "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" \
            "ndk;27.3.13750724" \
            "system-images;android-35;google_apis;x86_64"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Create the AVD
        run: |
          # `pixel_6` matches the profile docs/ENVIRONMENT.md records locally, so
          # the screen is the same size and any coordinates a test derives from a
          # view hierarchy behave the same way here.
          export PATH="$HOME/Android/Sdk/cmdline-tools/latest/bin:$PATH"
          echo no | avdmanager create avd -n hunmin-ci \
            -k "system-images;android-35;google_apis;x86_64" --device pixel \
            -c 512M --force
          echo "HUNMIN_AVD=hunmin-ci" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.config/.android/avd" >> "$GITHUB_ENV"

      - name: Configure host build (for engine tests)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHUNMIN_TRACE_BUILD=ON
      - name: Build host engine (for engine tests)
        run: cmake --build build --target hunmin

      - name: Cross-compile the engine and build the APK
        run: |
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          # BOTH ABIs: the APK declares arm64-v8a and x86_64 in abiFilters, and
          # AGP's externalNativeBuild fails the packaging step if either ABI's
          # libhunmin.so is missing -- so building one is not "half a job", it is
          # a failed one.
          ./tools/build-android.sh x86_64 24
          ./tools/build-android.sh arm64-v8a 24
          cd frontends/android
          ./gradlew --no-daemon assembleDebug

      - name: Tier E0 + E1 (engine on device, adapter in the JVM)
        # No emulator needed for either: E0 pushes the engine and the goldens
        # over adb, and E1 is a JVM test. This step is what catches a broken
        # build before the expensive boot below.
        #
        # Measured 2026-10-14 for issue #59: this is the SECOND run of exactly
        # these two tests -- the linux job ran them at 148.38 s and 84.31 s
        # because the runner image ships an Android SDK the workflow never
        # installs, so the CMakeLists.txt:192 guard fires there too. The linux
        # job's copy is not removed by this change (option A in
        # docs/CI-TIMING.md was measured and left as a maintainer call, because
        # excluding tier E1 from linux makes `linux` green while the android job
        # -- the only other place E1 runs -- is the one that failed at the SDK
        # step in run 38428978810). What IS fixed here is that both copies are
        # now warm: the Gradle cache restored above makes each ~23 s instead of
        # ~148 s.
        run: ctest --test-dir build -j4 -R "engine-android-goldens|engine-android-e1|android-mutations" --output-on-failure

      - name: Free disk space for emulator
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /home/runner
          # Remove unnecessary packages
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/emulator/qemu/linux-x86_64/qemu-system-i386* 2>/dev/null || true
          # Remove docker images if any
          docker system prune -af --volumes 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /home/runner

      - name: Boot the emulator
        run: |
          export PATH="$HOME/Android/Sdk/platform-tools:$HOME/Android/Sdk/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.config/.android/avd"
          echo "Listing AVDs:"
          avdmanager list avd
          "$ANDROID_HOME/emulator/emulator" -avd hunmin-ci \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -memory 1536 &
          EMULATOR_PID=$!
          adb wait-for-device
          # Bounded wait: the script must not hang the job if the image is slow.
          for _ in $(seq 1 60); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 || { echo "Emulator failed to boot"; kill $EMULATOR_PID 2>/dev/null; exit 1; }

      - name: Tier E2 (the APK, typed into with real key events)
        # The assertion is the committed text read out of a real EditText with
        # uiautomator, not anything hunmin logged -- see docs/TESTING.md.
        run: ./tools/android-e2e.sh x86_64

      - name: Tier E2, the Espresso half (issue #13)
        # The instrumentation suite under app/src/androidTest/. It was never
        # compiled before issue #13, so this step is the first CI runner the
        # suite has ever had: it fails if zero tests executed, which is the
        # "green having measured nothing" shape the issue records.
        #
        # On the runner there is no previously-selected IME worth restoring
        # (a fresh AVD), so the script's snapshot/restore is a no-op here.
        run: ./tools/android-espresso.sh

      - name: Emulator log on failure
        # Quoted, and it matters: unquoted, YAML 1.1 parses `failure()` as the
        # boolean True and GitHub rejects the whole workflow with "Invalid
        # workflow file: .github/workflows/ci.yml#L1". Measured 2026-10-13:
        # every CI run since the initial public commit (fbb0c43, 38 runs) failed
        # this way, so no CI job has executed even once.
        if: "${{ failure() }}"
        run: |
          adb logcat -d 2>/dev/null | tail -300 || true

  # Issue #8: the linux job runs ctest and hunmin-doctor; it does not package,
  # and the android job runs assembleDebug. Neither 0.1 artefact was ever built
  # by CI -- the .deb existed only as one local dpkg-buildpackage run and the
  # signed APK only as one local assembleRelease (docs/REMAINING-WORK.md §3).
  #
  # This job builds the .deb. It runs the suite inside the package build
  # (debian/rules override_dh_auto_test) rather than skipping it, because the
  # issue's own verification says a packaging job must not skip the suite.
  #
  # It installs the DISTRO fcitx5 via apt (issue #322): the addon's floor is
  # 5.1.7, which ubuntu-24.04 ships, so the .deb builds the addon against the
  # distro libfcitx5core-dev / fcitx5-modules-dev -- no source build, and the
  # resulting package installs against a noble user's distro fcitx5.
  #
  # The failure mode to expect first on a fresh checkout used to be
  # data-selfcheck red without the gitignored krdict dump (REMAINING-WORK.md
  # §0). 2026-10-17 (maintainer instruction): the test was unregistered — it
  # is not touched before its own dev stage, and on the Windows host the
  # converter-vs-committed-data divergence was red on every pass. The suite
  # here is expected fully green now; krdict-fixture guards the converter's
  # logic self-contained.
  deb:
    name: debian (.deb artefact)
    # No `needs: linux` (issue #322): this job used to restore the fcitx5
    # install tree the linux job uploaded, which made the dependency real. Both
    # jobs now install the distro fcitx5 independently, so there is no artefact
    # to share and no ordering to enforce -- the coupling is gone with the
    # source build.
    # Re-enabled 2026-11-22 (issue #292) as a NIGHTLY job, on the maintainer's
    # instruction: packaging is not a per-PR cost.
    # This is the noble artefact; ibus-jammy below is the 22.04 one.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # NOT 5 minutes, and the reason is measured rather than cautious. This job
    # took 13 m 30 s in run 38428978810 (docs/CI-TIMING.md §1): fcitx5 source
    # build 326 s + dpkg-buildpackage 460 s + apt 23 s. The 326 s source build is
    # gone (issue #322: distro fcitx5 via apt), leaving the ~460 s
    # dpkg-buildpackage as the real floor. 45 minutes stays until that floor is
    # measured again on the distro path; the number is a budget, not a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libhangul-dev \
            build-essential python3 python3-pil debhelper fakeroot \
            libxkbcommon-dev libx11-dev libibus-1.0-dev
          # The distro fcitx5 (issue #322), without recommends -- same rationale
          # as the linux job: the frontend stack is a Recommends no lane here
          # needs, and scoping --no-install-recommends to this line keeps the
          # dbus session bus the in-build IBus D2 lane uses.
          sudo apt-get install -y --no-install-recommends \
            libfcitx5core-dev fcitx5-modules-dev fcitx5-modules fcitx5
          # Pruned to the load-bearing set (issue #322): the xcb/cairo/pango/
          # wayland/-dev packages were the fcitx5 SOURCE build's deps and go with
          # it; fcitx5-modules' Depends supplies the runtimes D3's find_file
          # needs. ECM/gettext/libfmt-dev are not needed by the addon. The deb
          # job runs the suite in-build, so it keeps the linux job's test deps
          # (libxkbcommon-dev, libibus-1.0-dev, python3-pil) plus the packaging
          # tools (build-essential, debhelper, fakeroot).
          # The distro fcitx5 (issue #322): the addon's floor is 5.1.7, which
          # noble ships. These satisfy debian/control's build-depends, so the
          # package build no longer needs -d (see the Build step).
          # Without libibus-1.0-dev the frontend is dropped at configure and
          # install(TARGETS hunmin-ibus … COMPONENT ibus) never runs, so a
          # CI-built .deb cannot carry the 22.04 release's only frontend.
          # (This job is currently disabled by the 2026-11-01 instruction at
          # the top of the file; the dependency is corrected here so re-enabling
          # it does not silently ship an engine-less package.)
      # fcitx5 comes from the distro packages installed above (issue #322).
      # The install-tree restore from the linux job is gone: there is no source
      # build and no artefact to share. dh_shlibdeps now resolves fcitx5 from
      # dpkg's database (the distro libfcitx5core7 owns the .so), so the
      # dependency metadata is real -- see debian/rules' updated note.
      # Same cache as the linux job, same reason and the same measurement: this
      # job's suite carries 324 s of tier E1 (engine-android-e1 185.68 s plus
      # android-mutations 138.45 s, run 38428978810's deb job log), all of it
      # cold-Gradle. As of 2026-10-14 the tier-E1 tests are excluded from the
      # package build -- see debian/rules' override_dh_auto_test -- so what this
      # cache now serves is android-trace-emit.sh's Gradle classpath for the
      # tier-C Android corpus (16 -> 15 tests after the duplicate registration
      # was removed) plus frontend-mutations' sandbox builds. The cache is kept
      # because the classpath materialisation is still a Gradle invocation, and
      # because the exclusion above is a packaging decision that could be
      # revisited, at which point this is what makes the difference between
      # 324 s and 25 s.
      - name: Restore the Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontends/android/gradle.properties', 'frontends/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install pyright (debian/rules runs docs-lint, which asserts tools/ is clean)
        # python3-pil comes from this job's apt step, for the reason given at the
        # linux job's install step: pyright resolves imports in the interpreter it
        # inspects, not in its own tool environment.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install pyright
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Pre-populate googletest, the same step release.yml has (issue #325).
      #
      # WHY THIS JOB NEEDS IT AND `linux` DOES NOT. `dh_auto_configure` forces
      # -DFETCHCONTENT_FULLY_DISCONNECTED=ON, so FetchContent cannot download;
      # without a pre-populated source dir the GTest::gtest_main target never
      # exists and cmake fails inside
      # cmake/HunminLibhunminTests.cmake / HunminFrontendTests.cmake. That is
      # the noble nightly's red since 2026-11-15, measured on master run
      # 45014529790 (job 137185330546):
      #   CMake Error ... GTest::gtest_main ... but the target was not found
      #   FETCHCONTENT_SOURCE_DIR_GOOGLETEST:PATH=        (empty in the cache)
      # The `linux` job configures with a plain `cmake -B build`, where
      # FetchContent is allowed to download, so it never sees this.
      # release.yml had the step and this job did not; $HOME survives
      # dh_auto_clean of obj-*/_deps, which is why the copy lives there.
      - name: Pre-populate googletest
        run: |
          mkdir -p ~/googletest-src
          git clone --depth 1 --branch v1.17.0 https://github.com/google/googletest.git ~/googletest-src
      - name: Build the .deb
        # -us -uc unsigned: a key is not required to build the artefact, and
        # requiring one would make it unbuildable on a machine without one --
        # the exact "only one machine can produce the release" property the
        # issue is about. -b binary-only, same path as the local run.
        #
        # -d (ignore build-deps) is no longer needed (issue #322): fcitx5 now
        # comes from the distro packages installed above, so dpkg-checkbuilddeps
        # sees libfcitx5core-dev / fcitx5-modules-dev and the build-depends are
        # genuinely satisfied by package metadata. It was required only while
        # fcitx5 was a source build with no owning package (measured CI
        # 2026-10-13); dropping it restores the honest build-dep check.
        # SECONDS is a bash builtin, so the wall time is printed by the step
        # that actually builds -- no extra action, and no guess from a later
        # summary that cannot see this segment.
        #
        # FETCHCONTENT_SOURCE_DIR_GOOGLETEST is exported here rather than routed
        # through tools/build-release.sh so the builder stays
        # `dpkg-buildpackage -us -uc -b` with a real build-dep check (release.sh
        # passes -d, which this job deliberately dropped with issue #322).
        # debian/rules forwards the variable into cmake; see its
        # override_dh_auto_configure.
        run: |
          start=$SECONDS
          export FETCHCONTENT_SOURCE_DIR_GOOGLETEST="$HOME/googletest-src"
          dpkg-buildpackage -us -uc -b
          echo "=== dpkg-buildpackage (noble) wall time: $((SECONDS-start)) s ==="
      - name: What the package contains
        run: |
          deb="$(ls ../hunmin_*_*.deb)"
          dpkg-deb --info "$deb" | sed -n '1,4p'
          # Through a file, not a pipe into head: closing the pipe early makes
          # tar die on EPIPE and dpkg-deb print "tar subprocess returned error
          # exit status 2" (measured 2026-10-13), which reads like a broken
          # package. The file also gives the step a real exit status -- piped
          # into head, the status was head's, so an unreadable .deb passed.
          dpkg-deb --contents "$deb" > /tmp/hunmin-deb-contents.txt
          head -20 /tmp/hunmin-deb-contents.txt
      - name: Stage the .deb inside the workspace
        # upload-artifact@v4 refuses any pattern containing `..`, measured on
        # this job: "Invalid pattern '../hunmin_*_*.deb'. Relative pathing '.'
        # and '..' is not allowed." dpkg-buildpackage always writes one level
        # above the source tree, so the file is copied in rather than reached
        # at. This was the step that failed once the shlibdeps fix let the
        # build finish.
        run: |
          mkdir -p artifacts
          cp ../hunmin_*_*.deb artifacts/
          ls -la artifacts/
      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        with:
          name: hunmin-deb
          path: artifacts/hunmin_*.deb
          retention-days: 30

  # The Ubuntu 22.04 evaluation and release artefact (ruling 2026-11-09,
  # issue #289), built on a REAL ubuntu-22.04 runner so that libibus 1.5.26
  # and the absence of fcitx5 are measured rather than inferred from the
  # 26.04 host. Split into TWO jobs, each under the 3-minute ceiling
  # (maintainer instruction 2026-11-22, issue #316): the evaluation and the
  # package build. Measured on dispatch runs 45006949777 / 45007358427:
  # evaluation ~90-120 s, package ~70-105 s, but their SUM varied 122-187 s
  # across identical code -- one job at 180 s was a coin flip on runner
  # load. Two jobs give each half its own margin; no coverage is dropped
  # (the lanes gate below is unchanged) and no ceiling is raised. The full
  # measurement history is docs/CI-TIMING.md §8.
  ibus-jammy:
    name: ibus (D1/D2/D3 on Ubuntu 22.04)
    # Nightly like the noble deb job: a release evaluation, not a PR gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install build and D3 deps
        run: |
          sudo apt-get update
          # x11-xkb-utils (setxkbmap): IBus 1.5.26's `ibus engine <name>` runs
          # `setxkbmap -layout <engine layout>` after selecting the engine
          # (tools/main.vala get_set_engine -> exec_setxkbmap, gated on the
          # GSettings use-system-keyboard-layout default of false). Without
          # setxkbmap the selection command exits nonzero even though the
          # engine WAS selected -- measured on the first dispatch run of this
          # job (issue #316). 1.5.34 on the 26.04 host has setxkbmap
          # installed, which is why local runs never saw it. The portal
          # activation error in the same log is non-fatal (bus/server.c only
          # prints it) and is not the cause.
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 \
            build-essential debhelper \
            libhangul-dev libibus-1.0-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            python3-gi gir1.2-gtk-3.0 python3-xlib \
            xvfb x11-utils x11-xkb-utils xauth dbus ibus ibus-gtk3
      # The ruling says dpkg-checkbuilddeps on jammy must succeed with only
      # the build dependencies. Run it WITHOUT -d so the claim is actually
      # tested. (The noble deb job no longer needs -d either: since issue #322
      # fcitx5 is a distro package there, so its build-depends are real.)
      - name: Verify jammy Build-Depends (no -d)
        run: dpkg-checkbuilddeps -Pnobilus
      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j4
      - name: IBus D1/D2/D3 on IBus 1.5.26
        # Not a skip-tolerant selection: D3 registers here (Xvfb and im-ibus
        # are installed above), and a skip would be the "green having measured
        # nothing" shape this track exists to prevent. The -R regex is
        # unanchored, so engine-d3-ibus also selects the edit and candidate
        # lanes (issue #316). ctest exits 0 on a SKIP (SKIP_RETURN_CODE 77),
        # so the JUnit gate below is what makes a skip fail the job.
        run: |
          ctest --test-dir build -j4 \
            -R 'engine-d1-ibus|engine-d1-ibus-judgement|engine-d2-ibus-ui|engine-d3-ibus' \
            --output-on-failure --output-junit "$GITHUB_WORKSPACE/build/junit-ibus.xml"
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("build/junit-ibus.xml").getroot()
          cases = {c.get("name"): c for c in root.iter("testcase")}
          expected = [
              "engine-d1-ibus",
              "engine-d1-ibus-judgement",
              "engine-d2-ibus-ui",
              "engine-d3-ibus",
              "engine-d3-ibus-edit",
              "engine-d3-ibus-candidate",
          ]
          bad = []
          for name in expected:
              c = cases.get(name)
              if c is None:
                  bad.append(name + ": not registered")
                  continue
              if c.get("status") != "run" or c.find("skipped") is not None or c.find("failure") is not None:
                  bad.append(name + ": status=" + str(c.get("status")))
          if bad:
              print("::error::IBus lanes did not register and pass: " + "; ".join(bad))
              sys.exit(1)
          print("IBus lanes registered and passed: " + ", ".join(expected))
          PY

  ibus-jammy-package:
    name: ibus (.deb artefact, Ubuntu 22.04)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    # 3 min, measured ~70-105 s (docs/CI-TIMING.md §8). The package build
    # runs no tests (nocheck): the jammy evaluation is the ibus-jammy job
    # above, the full suite is the linux job, and the noble package build
    # keeps its own in-build suite. debian/rules turns BUILD_TESTING=OFF
    # under nocheck, so no googletest/test binaries are built here at all.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 \
            build-essential debhelper fakeroot \
            libhangul-dev libibus-1.0-dev libx11-dev libxcb1-dev libxkbcommon-dev
      - name: Verify jammy Build-Depends (no -d)
        run: dpkg-checkbuilddeps -Pnobilus
      - name: Build the .deb (nobilus profile)
        # parallel=4: the runner's core count; without it debhelper builds at
        # -j1. nocheck: see the job comment -- what it leaves out is named
        # there, and debian/rules skips building the test binaries under it.
        run: |
          start=$SECONDS
          DEB_BUILD_OPTIONS="parallel=4 nocheck" \
            dpkg-buildpackage -us -uc -b -Pnobilus
          echo "=== dpkg-buildpackage (jammy, nobilus) wall time: $((SECONDS-start)) s ==="
      - name: What the package contains
        run: |
          deb=$(ls ../hunmin-ibus_*_*.deb)
          dpkg-deb --contents "$deb" > /tmp/ibus-deb-contents.txt
          head -20 /tmp/ibus-deb-contents.txt
          # The ruling: no fcitx5 package and no fcitx5 dependency on jammy.
          if ls ../hunmin_[0-9]*_*.deb >/dev/null 2>&1; then
            echo "::error::the noble hunmin (fcitx5) package leaked into the jammy build"
            exit 1
          fi
          if dpkg-deb --field "$deb" Depends | grep -q fcitx5; then
            echo "::error::hunmin-ibus declares a fcitx5 dependency"
            exit 1
          fi
      - name: Stage the artefacts
        run: |
          mkdir -p artifacts
          cp ../libhunmin_*_*.deb ../hunmin-data_*.deb \
             ../hunmin-ibus_*_*.deb ../hunmin-en-us_*.deb artifacts/
          ls -la artifacts/
      - name: Upload the jammy .debs
        uses: actions/upload-artifact@v4
        with:
          name: hunmin-ibus-jammy-deb
          path: artifacts/*.deb
          retention-days: 30

  # The signed release APK, and the reason it is gated on a repository
  # variable and produces a throwaway signature.
  #
  # B8 (issue #1) was decided 2026-10-13: build.gradle.kts reads
  # HUNMIN_RELEASE_STORE, else a gitignored local.properties, else generates a
  # throwaway key at build time. This job takes the first route with a
  # throwaway key of its own, written to RUNNER_TEMP and never into the tree --
  # so it proves the release BUILD works, not that the release SIGNATURE does.
  # When a real release key exists, this job is where it would be wired in:
  # point HUNMIN_RELEASE_STORE at it instead of generating one.
  android-release:
    name: android release APK (unsigned keystore)
    # DISABLED 2026-11-01 -- see the header. The gate it had was
    #   github.event_name == 'push' && github.ref == 'refs/heads/master' &&
    #   vars.HUNMIN_BUILD_RELEASE == 'true'
    if: false
    runs-on: ubuntu-24.04
    # NOT 5 minutes: installs the Android SDK and NDK from the network, then
    # builds a release APK for two ABIs through Gradle. Same shape as the
    # android job's SDK step -- an unbounded-by-cache network download. Gated
    # on master + an opt-in variable, so it does not run on a PR at all; the
    # ceiling exists so a hung Gradle cannot bill indefinitely.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android SDK
        run: |
          sdk_root="$HOME/Android/Sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q tools.zip -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.3.13750724"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Generate a throwaway release keystore
        # Not a real release key. B8 was decided 2026-10-13 (local.properties,
        # HUNMIN_RELEASE_STORE override, throwaway-key fallback); this job
        # takes the override with a key of its own, so assembleRelease runs
        # end-to-end without borrowing the debug keystore and without writing a
        # keystore into the tree.
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass android -alias hunmin -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=hunmin-ci,O=hunmin,L=CI,C=KR'
          echo "HUNMIN_RELEASE_STORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the release APK (arm64-v8a + x86_64)
        # Both ABIs: the APK declares both in abiFilters, and AGP fails the
        # packaging step if either ABI's libhunmin.so is missing.
        run: |
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          ./tools/build-android.sh arm64-v8a 24
          ./tools/build-android.sh x86_64 24
          cd frontends/android
          ./gradlew --no-daemon :app:assembleRelease
      - name: Upload the release APK
        uses: actions/upload-artifact@v7
        with:
          name: hunmin-release-apk
          # The APK names itself hunmin-<versionName>.apk (app/build.gradle.kts).
          path: frontends/android/app/build/outputs/apk/release/hunmin-*.apk
          retention-days: 30

  mingw:
    # Enabled with the PR rung (2026-11-01, instruction quoted at the top of this
    # file). No `if:` on purpose: it runs on push, pull request, the nightly and
    # by hand -- it is a cross-compile, so it is the cheapest thing this workflow
    # can say about a commit.
    runs-on: ubuntu-24.04
    # 3 minutes, matching the linux job's ceiling. This job cross-compiles one
    # target (`--target hunmin`) and builds no tests, so it has no ctest step to
    # bound; the ceiling is here so a hung compiler cannot bill indefinitely,
    # not to make it fit.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build mingw-w64
      - run: cmake -B build -G Ninja --toolchain cmake/toolchain-mingw-w64.cmake -DBUILD_TESTING=OFF
      - run: cmake --build build --target hunmin

  # DISABLED -- issue #51, the maintainer's words:
  #
  #   "for windows, it is not scope of this version. so in the issue we will
  #    disable windows test."
  #
  # There is no Windows frontend to test: `ls frontends/` is `android fcitx5`,
  # and AGENTS.md says a Windows TSF frontend "is planned and does not exist
  # yet". The fcitx5 addon is not built here either -- it prints "Fcitx5Core not
  # found: fcitx5 addon disabled" -- so this job asserts one thing only: that
  # the core shared library compiles under MSVC. That is not a shipped 0.1
  # artefact, which is what the ruling scopes out.
  #
  # It was red on master before this, unconditionally and since at least 0d046bc:
  #
  #   cl : command line error D8021: invalid numeric argument '/Wextra'
  #     [D:\a\hunmin\hunmin\build\hunmin.vcxproj]
  #
  # because CMakeLists.txt:10 `add_compile_options(-Wall -Wextra)` is passed to
  # cl, which has no -Wextra, so the job dies before compiling a line. The
  # `mingw` job builds the same --target hunmin under GCC and passes.
  #
  # `if: false` and not a deleted block: a deleted job cannot answer "was
  # Windows ever built here, and why did it stop". The /Wextra flag is
  # deliberately NOT guarded with if(NOT MSVC) -- that would turn the job
  # green, which is a different decision from the one that was ruled; if MSVC
  # support is wanted later it is its own issue with its own measurement. No
  # other job references this one, so nothing here depends on it.
  windows:
    # Enabled for PR testing. Compiles core with MSVC; /Wextra is guarded by
    # CMakeLists.txt:13-17 (MSVC uses /W4, GCC uses -Wall -Wextra).
    # No Windows TSF frontend exists (issue #51), so this job only asserts the
    # core shared library compiles under MSVC — not a shipped artefact.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build -A x64 -DBUILD_TESTING=OFF
      - run: cmake --build build --target hunmin --config RelWithDebInfo

  # Tier E4: nightly soak / fuzz with LeakSanitizer
  # Runs nightly at 03:00 UTC. Builds with LeakSanitizer, generates random
  # HW-key streams via the existing mutation harness, and auto-files crashes
  # as GitHub issues with reproduction steps.
  nightly-fuzz:
    name: nightly fuzz (LeakSanitizer)
    # DISABLED 2026-11-01 -- see the header. Re-enable with
    # `if: github.event_name == 'schedule'`.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    # NOT 5 minutes, and structurally cannot be: the loop below runs 10,000
    # fuzz iterations, each a hunmin-sim invocation. This is a nightly soak, not
    # a PR gate -- `if: github.event_name == 'schedule'` means a push pays
    # nothing for it, so the cost concern that bounds the other jobs does not
    # apply here in the same way. The ceiling is a runaway guard: without one,
    # a hang in iteration 1 bills until GitHub kills it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build pkg-config libhangul-dev python3 \
            libxkbcommon-dev libx11-dev libasan8 liblsan0
          # Distro fcitx5 without recommends (issue #322 prune); the fuzz loop
          # only drives hunmin-sim, but the tree still builds the addon, so the
          # fcitx5 stack stays. The source-build -dev deps are gone with the
          # source build; fcitx5-modules' Depends supplies the D3 runtimes.
          sudo apt-get install -y --no-install-recommends \
            libfcitx5core-dev fcitx5-modules-dev fcitx5-modules fcitx5

      # fcitx5 comes from the distro packages above (issue #322): the addon's
      # floor is 5.1.7, which noble ships. The 5.1.13 source build and its cache
      # are gone, same as the linux and deb jobs.

      - name: Configure with LeakSanitizer
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHUNMIN_TRACE_BUILD=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,leak -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,leak -fno-omit-frame-pointer"

      - name: Build with LeakSanitizer
        run: cmake --build build -j16

      - name: Run engine fuzz (random HW-key streams, 10000 iterations)
        run: |
          cd build
          for i in $(seq 1 10000); do
            # Generate random valid key sequence from the layout tables
            KEYS="$(python3 ../tools/fuzz-generate-keys.py --layout sin3-p2 --len 50)"
            ../build/hunmin-sim --data ../libhunmin/data --layout sin3-p2 --keys "$KEYS" --trace \
              > /tmp/fuzz-$i.trace 2>&1 || {
                echo "FAIL: fuzz iteration $i crashed"
                cat /tmp/fuzz-$i.trace
                # Create GitHub issue with reproduction steps. Keep the body in
                # a FILE: a full LSan stack overflowed argv on 2026-11-21
                # (`/usr/bin/gh: Argument list too long`) and lost the report.
                # `bug` is an existing label; the old fuzz/crash/auto-filed
                # names do not exist in this repository, so gh cannot add them.
                gh issue create --title "[ci] Fuzz crash: iteration $i" \
                  --body-file /tmp/fuzz-$i.trace \
                  --label "bug" || true
                exit 1
              }
            # Check for LeakSanitizer reports in stderr
            if grep -q "LeakSanitizer" /tmp/fuzz-$i.trace; then
              echo "FAIL: LeakSanitizer reported leak in iteration $i"
              cat /tmp/fuzz-$i.trace
              gh issue create --title "[ci] LeakSanitizer leak: iteration $i" \
                --body-file /tmp/fuzz-$i.trace \
                --label "bug" || true
              exit 1
            fi
          done

      - name: Run Android mutation fuzz (LeakSanitizer)
        if: false
        run: |
          # Disabled until Android emulator supports LeakSanitizer reliably
          # export ASAN_OPTIONS=detect_leaks=1
          # python3 tools/android-mutations.py --strategy sandbox

      - name: Upload fuzz artifacts on failure
        if: "${{ failure() }}"
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: /tmp/fuzz-*.trace
          retention-days: 30