org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only. Nothing here pulls a UI or image library: an IME's whole
# on-screen surface is the InputConnection's composing text, and a keyboard
# view is P5's later work (see docs/DESIGN-FRONTEND.md Part B).
android.useAndroidX=true
android.nonTransitiveRClass=true

# The ABI set is deliberate and narrow. tools/build-android.sh can build any
# of the four, but the app ships x86_64 only for the emulator (tier E2) and
# arm64-v8a for real devices; x86 and armeabi-v7a are 32-bit legacy and are
# left out on purpose, not by omission -- universal APKs with all four ABIs
# were measured at 4x the native payload for engines this size.
hunmin.abi=x86_64
